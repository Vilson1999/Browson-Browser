name: GitHub Bot Error Checker & Auto-Fixer

on:
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-and-fix:
    name: Bot Error Diagnostics & Auto-Fixer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Ensure Executable Gradlew
        run: |
          chmod +x gradlew
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Build Diagnostics & Tests
        id: diagnostics
        run: |
          echo "Running Gradle verification..."
          ./gradlew testDebugUnitTest --continue --no-daemon 2>&1 | tee test-output.log
        continue-on-error: true

      - name: Auto-Fix File Formatting & Permissions
        id: autofix
        run: |
          HAS_CHANGES=false

          # 1. Ensure gradlew is executable
          if [ ! -x "./gradlew" ]; then
            chmod +x ./gradlew
            HAS_CHANGES=true
          fi

          # 2. Fix trailing whitespace in kotlin files if any
          find app/src -name "*.kt" -exec sed -i 's/[ \t]*$//' {} + || true
          if [ -n "$(git status --porcelain)" ]; then
            HAS_CHANGES=true
          fi

          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT

          if [ "$HAS_CHANGES" == "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(bot): auto-fix code formatting and file permissions [skip ci]" || true
            git push origin HEAD:${{ github.head_ref || github.ref_name }} || true
            echo "Auto-fixes committed and pushed successfully."
          fi

      - name: Post PR Error Summary Comment
        if: steps.diagnostics.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('test-output.log', 'utf8');
              const lines = log.split('\n');
              const errorLines = lines.filter(l => l.includes('FAILURE') || l.includes('FAILED') || l.includes('Unresolved reference') || l.includes('error:') || l.includes('Exception'));
              const errorSummary = errorLines.slice(-15).join('\n');

              const body = `### 🤖 GitHub Bot Error Report\n\n` +
                `Tests or build failed in this run. Here is the diagnostic summary:\n\n` +
                `\`\`\`\n${errorSummary || 'Check workflow run logs for full error stack trace.'}\n\`\`\`\n\n` +
                `*Please fix the highlighted errors and push again.*`;

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (e) {
              console.log('Could not post comment: ' + e);
            }
