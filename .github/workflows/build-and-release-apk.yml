name: Build & Release Browson APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (for example v1.0.1)"
        required: false
        type: string

concurrency:
  group: browson-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Verify and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find Android sdkmanager under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare release APK
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        id: release_apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = \"\\([^\"]*\\)\".*/\\1/p' app/build.gradle.kts | head -n 1)
          VERSION_NAME="${VERSION_NAME:-1.0}"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            ./gradlew assembleRelease --no-daemon --stacktrace
            APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
            BUILD_TYPE=release
          else
            echo "::warning::Release signing secrets are not configured; publishing the debug-signed APK. Configure ANDROID_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD for a stable release signature."
            APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
            BUILD_TYPE=debug
          fi

          if [ -z "$APK" ]; then
            echo "No APK was produced" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v${VERSION_NAME}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi

          mkdir -p release-apks
          cp "$APK" "release-apks/Browson-${TAG}-${BUILD_TYPE}.apk"
          (cd release-apks && sha256sum ./*.apk > checksums.txt)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: browson-apk-${{ github.run_number }}
          path: release-apks/*
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release
        if: success() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_apk.outputs.tag }}
          name: Browson ${{ steps.release_apk.outputs.tag }}
          generate_release_notes: true
          files: |
            release-apks/*.apk
            release-apks/checksums.txt
          body: |
            ## Browson ${{ steps.release_apk.outputs.tag }}

            - App version: ${{ steps.release_apk.outputs.version }}
            - APK build type: ${{ steps.release_apk.outputs.build_type }}
            - SHA-256 checksums are attached.

            For upgrade-compatible releases, configure repository secrets `ANDROID_KEYSTORE_BASE64`, `STORE_PASSWORD`, and `KEY_PASSWORD` with the app's persistent upload key. Without these secrets, the workflow publishes a debug-signed APK.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test reports if the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browson-build-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
